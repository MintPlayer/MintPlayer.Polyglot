name: PR checks (Linux build-once, fan-out legs)
# The PR-level compile gate this repo was missing (added after the P30 squash broke every POSIX
# release leg post-merge — run 29485382814): an ubuntu cmake/g++ build + the harness legs, so
# platform-forked code (#ifdef transport, dlopen/popen, chrono/filesystem quirks) is compiled by a
# second toolchain BEFORE merge instead of first meeting g++ in the tag-triggered release. No macOS /
# Windows runners here — Windows is the local gate, the release run stays the cross-platform proof.
# Same toolchain floor as release.yml's linux-x64 (ubuntu-22.04 = glibc 2.35, PRD §4.14).
#
# THE 5-MINUTE WALL (P41 slice 7, D12/D14 — docs/prd/issue-76-68-deterministic-output/PRD.md §4.9).
# The whole workflow must finish in 5 minutes on a cache-cold PR run. The 2026-10-19 07:57 master run
# took 11 minutes: the single 6757-line tests_main.cpp translation unit compiled for ~9.5 min at -O2
# (P40 had added 3115 lines to it). Root cause fixed at the source (per-area test TUs, unoptimized test
# binary → Linux build ≈ 1.5 min); this file fixes the SHAPE: build ONCE, upload the binaries as an
# artifact, fan the legs out as parallel jobs that each install only their own toolchain.
#   budget = build ≈ 1.5 min + artifact round trip ≈ 0.5 min + slowest leg
#            (nuget ≈ 41 s, smoke tier ≈ 19 s, conformance ≈ 97 s parallel per P35)  → ≈ 3.5–4 min.
# Every job carries `timeout-minutes: 5` as the tripwire (a hang fails naming its leg, never silently
# eats the budget), and a superseded PR run is cancelled by the concurrency group. If a measured run
# still exceeds the wall, `conformance` is the first leg to leave (see its matrix entry).
#
# The runners are invoked DIRECTLY (`pwsh -NoProfile -File tests/<leg>/run-*.ps1 -Cli build/polyglot`)
# — the standing contract that every runner works WITHOUT nx. NX (project.json / scripts/nx-leg.ps1) is
# the LOCAL orchestrator with its per-leg cache; CI no longer installs it (no `npm ci`, no remote-cache
# token: ~6 s and one secret fewer per job). release.yml calls the same runners the same way.
on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'plugins/**'
      - 'scripts/**'
      - 'CMakeLists.txt'
      - '.github/workflows/ci.yml'
  push:
    branches: [master]
  workflow_dispatch:

# A new push to the same ref supersedes the running PR check — cancel it instead of paying for both.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------------------------
  # 1. Build ONCE: Release CLI + the (unoptimized) unit-test binary, via the same script release.yml
  #    and the local nx `build` target use (native bash so cmake's -D args pass intact — see the
  #    script header; POLYGLOT_VERSION defaults to 0.0.0-dev, the shallow-checkout pin). CMake copies
  #    plugins/ next to the binary post-build ("Copying target plugins next to polyglot"), and the CLI
  #    finds its plugins there, not in cwd — so plugins/ travels inside the artifact.
  # ---------------------------------------------------------------------------------------------
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain (cmake, g++)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq cmake g++

      - name: Build (cmake Release, -j nproc)
        run: bash scripts/build-linux.sh

      # upload-artifact drops the executable bit; every leg job `chmod +x` after download.
      - name: Upload binaries + plugins
        uses: actions/upload-artifact@v4
        with:
          name: polyglot-linux
          path: |
            build/polyglot
            build/polyglot-tests
            build/plugins/**
          retention-days: 1
          if-no-files-found: error

  # ---------------------------------------------------------------------------------------------
  # 2. Fan out. One matrix job per leg group; each downloads the artifact, installs ONLY the toolchain
  #    its runners probe for (`dotnet` / `node` entries below — absent means the ubuntu image's
  #    pwsh + preinstalled node/python3/php suffice), and runs its runner(s) directly. `fail-fast:
  #    false` so one red leg never hides another. The old single-job shape had a lesson baked in:
  #    a leg that hangs inside `nx run-many` prints nothing (its output sits in the pipe buffer until
  #    it exits) and eats the whole job budget unattributed. Separate jobs with `timeout-minutes`
  #    make every hang bounded AND named — that lesson is now structural, not a special-cased step.
  # ---------------------------------------------------------------------------------------------
  legs:
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    name: leg / ${{ matrix.leg }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Unit suite + the two POSIX harness legs (watch-mode polling + the registry HTTP transport —
          # the `#ifdef`-forked code that broke every P30 POSIX release leg). The registry gate's fake
          # npm registry is a node script; the image's preinstalled node is enough for it.
          - leg: unit-watch-registry
            run: |
              build/polyglot-tests
              pwsh -NoProfile -File tests/watch/run-watch.ps1 -Cli build/polyglot
              pwsh -NoProfile -File tests/registry/run-registry.ps1 -Cli build/polyglot

          # The CLI front door, the §3.B refusal contract and the LSP protocol gate: dependency-free
          # (none of the three probes for node/dotnet/python/php).
          - leg: smoke-refusals-lsp
            run: |
              pwsh -NoProfile -File tests/cli/run-cli-smoke.ps1 -Cli build/polyglot
              pwsh -NoProfile -File tests/refusals/run-refusals.ps1 -Cli build/polyglot
              pwsh -NoProfile -File tests/lsp/run-lsp.ps1 -Cli build/polyglot

          # P39 coverage attribution (checked-in fixtures: no Python, no PHP, no network) + the smoke
          # transpile that proves plugins are found next to the binary, not in cwd.
          - leg: coverage-attribution
            run: |
              pwsh -NoProfile -File tests/coverage/run-coverage.ps1 -Cli build/polyglot
              printf 'fn main() {\n  print(6 * 7)\n}\n' > /tmp/smoke.pg
              (cd /tmp && "$GITHUB_WORKSPACE/build/polyglot" build /tmp/smoke.pg --target csharp --out /tmp/ --lib io)
              grep -q 'print(6 \* 7)' /tmp/smoke.cs

          # P11 NuGet gate (D12: joins PR CI). `-Cli` makes the runner stage build/polyglot + plugins as
          # tools/linux-x64/ and pack with -p:PolyglotStageRoot (the same multi-RID hook release.yml
          # uses) — without it the local pack ships only the Windows x64\Debug exe and the .targets
          # would fail with "no polyglot binary for host RID 'linux-x64'". `-Work` gives it a private
          # NuGet package cache (NUGET_PACKAGES) so nothing depends on $HOME layout. The fixtures create
          # net8.0 consumers and two of them multi-target net8.0;net10.0 and `dotnet run` both, so BOTH
          # runtimes must be present — never rely on the image's preinstalled set for that.
          - leg: nuget
            dotnet: |
              8.0.x
              10.0.x
            run: pwsh -NoProfile -File tests/msbuild/run-nuget.ps1 -Cli build/polyglot -Work /tmp/polyglot-nuget-gate

          # The merged parallel differential runner, all four targets (P35: ~97 s). Needs dotnet (the
          # `csc /shared` oracle compiles against the ACTIVE SDK's net10 ref pack — pin it), node >= 22
          # (runs the emitted TS via type-stripping; the image ships 20), and python3 + php (both
          # preinstalled on ubuntu-22.04 — the runner exits 2 loudly if either is missing, it never
          # passes vacuously). FIRST LEG TO LEAVE if a measured cold run of this workflow exceeds the
          # 5-minute wall (PRD §4.9): drop this entry, and PLAN.md must say conformance is Windows/
          # release-only again.
          - leg: conformance
            dotnet: 10.0.x
            node: 22
            run: pwsh -NoProfile -File tests/conformance/run-conformance.ps1 -Cli build/polyglot
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download binaries + plugins
        uses: actions/download-artifact@v4
        with:
          name: polyglot-linux
          path: build

      - name: Restore executable bits
        run: chmod +x build/polyglot build/polyglot-tests

      - name: Set up .NET
        if: matrix.dotnet != ''
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnet }}

      - name: Set up Node
        if: matrix.node != ''
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Run leg
        run: ${{ matrix.run }}

  # Wave-2 slice 7: C++ line coverage of the Core/CLI, report-only (no threshold until a baseline
  # exists). Unit suite + a four-target CLI transpile sweep of the conformance programs, so both the
  # front-end AND the emitter/rule-interpreter paths accumulate .gcda. What this deliberately does NOT
  # measure: the plugin JSON templates — their instrument is the differential conformance suite.
  # Builds its OWN instrumented Debug binary (not the artifact above), so it runs in parallel with
  # `build` rather than after it; ~4 min today, inside the wall on its own.
  coverage:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    # OIDC instead of a COVERAGE_TOKEN secret: this repo is public, so it authenticates to the
    # coverage server tokenlessly (the MintPlayer.AI precedent). Fork PRs cannot mint an id-token
    # and are skipped by the upload step's guard rather than failing.
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain (cmake, g++, gcovr)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq cmake g++ gcovr

      - name: Build (Debug, --coverage)
        run: |
          cmake -S . -B build-cov -DCMAKE_BUILD_TYPE=Debug -DPOLYGLOT_VERSION=0.0.0-dev \
            -DCMAKE_CXX_FLAGS=--coverage -DCMAKE_EXE_LINKER_FLAGS=--coverage
          cmake --build build-cov -j"$(nproc)"

      - name: Unit tests (instrumented)
        run: ./build-cov/polyglot-tests

      # `|| true` throughout: this leg's job is EXECUTION, not verification — correctness is the
      # Windows differential gate's job, and a failing transpile must not fail the coverage job.
      # --emit-arm-trace appends to one file across every invocation (the numerator AND the
      # denominator come from the compiler's own parse — see arm_trace.hpp).
      - name: Conformance transpile sweep (instrumented CLI, all four targets)
        run: |
          mkdir -p /tmp/cov-out coverage/plugins
          for t in csharp typescript python php; do
            for p in tests/conformance/programs/*.pg; do
              ./build-cov/polyglot --emit-arm-trace /tmp/arm-trace.tsv \
                build "$p" --target "$t" --lib io --out /tmp/cov-out >/dev/null 2>&1 || true
            done
          done

      # Widen past `build`, or the diagnostic and front-end-only paths read as dead code and
      # dishonestly depress the baseline. Both are runtime-free, so this costs seconds.
      # Multi-file programs build the way the conformance runner builds them — entry.pg + --root
      # with a pgconfig naming every target, not a single --target. Swept as loose files they would
      # miss the linked-module arms entirely (`module.linked` -> `partial `, attribute imports,
      # module globals), which measured as a ~20% slice of each manifest on their own.
      - name: Multi-module sweep (config-sourced, all targets at once)
        run: |
          for d in tests/conformance/programs/*/; do
            [ -f "$d/entry.pg" ] || continue
            w="/tmp/cov-mod/$(basename "$d")"
            mkdir -p "$w" && cp -r "$d"/* "$w"/
            echo '{ "targets": ["csharp","typescript","python","php"] }' > "$w/pgconfig.json"
            ./build-cov/polyglot --emit-arm-trace /tmp/arm-trace.tsv \
              build "$w/entry.pg" --root "$w" --lib io --out "$w" >/dev/null 2>&1 || true
          done

      - name: Diagnostic sweep (refusals + check)
        run: |
          for p in tests/refusals/fixtures/*.pg; do
            ./build-cov/polyglot --emit-arm-trace /tmp/arm-trace.tsv \
              build "$p" --target csharp --lib io --out /tmp/cov-out >/dev/null 2>&1 || true
          done
          for p in tests/conformance/programs/*.pg; do
            ./build-cov/polyglot --emit-arm-trace /tmp/arm-trace.tsv \
              check "$p" --lib io >/dev/null 2>&1 || true
          done

      # Same reason as the multi-module sweep above: `coverage remap` is a whole subcommand plus four
      # report readers and writers that `build` never reaches, so without this sweep it reads as dead
      # code and dishonestly depresses the baseline. It is exercised for correctness by
      # tests/coverage/run-coverage.ps1; this step exists only to EXECUTE it under instrumentation.
      # Both origin styles, every input format, and the error paths that refuse.
      - name: Coverage-attribution sweep (both origin sinks, every format)
        run: |
          w=/tmp/cov-attr && mkdir -p "$w"
          for t in python csharp; do
            ./build-cov/polyglot build docs/lang/samples/03_enums_unions_match.pg \
              --target "$t" --out "$w/$t" --origin-info >/dev/null 2>&1 || true
          done
          # sourceMapV3: project the committed real coverage.py reports, every output format.
          for f in cobertura lcov istanbul clover; do
            for r in py.cobertura.xml py.lcov; do
              ./build-cov/polyglot coverage remap "tests/coverage/fixtures/reports/$r" \
                --target python --generated-dir tests/coverage/fixtures/generated --root . \
                --out-format "$f" --out "$w/out-$r-$f" >/dev/null 2>&1 || true
            done
          done
          ./build-cov/polyglot coverage remap tests/coverage/fixtures/reports/py.lcov \
            --target python --generated-dir tests/coverage/fixtures/generated --root . \
            --branch-arms --out "$w/arms.lcov" >/dev/null 2>&1 || true
          # directive: a .pg-keyed report passing through, and one that is not (the refusal path).
          printf '<coverage><packages><package><classes><class name="m" filename="%s"><lines><line number="1" hits="4"/></lines></class></classes></package></packages></coverage>' \
            "docs/lang/samples/03_enums_unions_match.pg" > "$w/cs.xml"
          ./build-cov/polyglot coverage remap "$w/cs.xml" --target csharp \
            --generated-dir "$w/csharp" --root . --out "$w/cs.pg.xml" >/dev/null 2>&1 || true
          # Refusals: unknown format, unparseable report, no origin data, a target with no sink.
          mkdir -p "$w/empty"
          echo 'not a coverage report' > "$w/junk.txt"
          ./build-cov/polyglot coverage remap "$w/junk.txt" --target python \
            --generated-dir tests/coverage/fixtures/generated --root . --out "$w/x" >/dev/null 2>&1 || true
          ./build-cov/polyglot coverage remap tests/coverage/fixtures/reports/py.lcov --target python \
            --format cobertura --generated-dir tests/coverage/fixtures/generated --root . \
            --out "$w/x" >/dev/null 2>&1 || true
          ./build-cov/polyglot coverage remap tests/coverage/fixtures/reports/py.lcov --target python \
            --generated-dir "$w/empty" --root . --out "$w/x" >/dev/null 2>&1 || true
          ./build-cov/polyglot coverage remap tests/coverage/fixtures/reports/py.lcov \
            --target nosuchtarget --root . --out "$w/x" >/dev/null 2>&1 || true
          ./build-cov/polyglot coverage >/dev/null 2>&1 || true
          ./build-cov/polyglot coverage --help >/dev/null 2>&1 || true

      - name: Coverage report (gcovr)
        run: |
          mkdir -p coverage-report coverage/cpp
          # `--xml` (not `--cobertura`): both emit Cobertura, but the spelling `--cobertura` only
          # exists in gcovr >= 5.1 and ubuntu-22.04 ships 5.0. `--xml` works on both.
          gcovr --root . --filter 'src/' --print-summary \
            --xml coverage/cpp/cobertura.xml \
            --html-details coverage-report/index.html --txt coverage-report/summary.txt
          { echo '### C++ coverage — Core + CLI (unit suite + conformance transpile sweep)';
            echo '```';
            cat coverage-report/summary.txt;
            echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      # Plugin arm coverage: fold the trace into one lcov per manifest. This is what SP1 probes —
      # whether the server ingests and renders a report whose source file is a .json.
      - name: Plugin arm coverage (trace -> lcov)
        run: |
          pwsh -NoProfile -File scripts/arm-trace-to-lcov.ps1 \
            -Trace /tmp/arm-trace.tsv -OutDir coverage/plugins

      # The server resolves report paths by longest-suffix match against `git ls-files` and drops a
      # non-matching path SILENTLY — a wrong number, not an error. Fail loudly instead.
      - name: Verify coverage paths resolve
        run: pwsh -NoProfile -File scripts/verify-coverage-paths.ps1 -Path coverage

      # Publishing to coverage.mintplayer.com (org convention: the shared MintPlayer.Spark action).
      # NOTE: `partial:` is deliberately NOT set, unlike the nx repos. Those upload an `nx affected`
      # subset and must declare it partial so the server compares like-for-like; this job uses no NX
      # and no affected set — it builds cold and sweeps the entire conformance corpus on every run,
      # so its upload is COMPLETE. Declaring it partial would invite the server to carry stale file
      # data forward over freshly-measured files.
      - name: Upload coverage
        if: >
          (github.event_name != 'pull_request'
           || github.event.pull_request.head.repo.full_name == github.repository)
          && hashFiles('coverage/cpp/cobertura.xml') != ''
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        uses: MintPlayer/MintPlayer.Spark/apps/CodeCoverage/action@coverage-upload-v1
        with:
          url: https://coverage.mintplayer.com
          use-oidc: true
          files: |
            coverage/cpp/cobertura.xml
            coverage/plugins/*.lcov
          disable-search: true
          flags: cpp-core,plugins,linux
          base-sha: ${{ github.event.pull_request.base.sha }}
          finish: true
          fail-ci-if-error: ${{ github.event_name != 'pull_request' }}

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage-report/
