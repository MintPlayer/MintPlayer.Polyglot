name: PR checks (Linux build + unit tests)
# The PR-level compile gate this repo was missing (added after the P30 squash broke every POSIX
# release leg post-merge — run 29485382814): a single ubuntu cmake/g++ build + the unit suite,
# so platform-forked code (#ifdef transport, dlopen/popen, chrono/filesystem quirks) is compiled
# by a second toolchain BEFORE merge instead of first meeting g++ in the tag-triggered release.
# Deliberately ONE cheap leg (no macOS/Windows runners, no differential conformance — Windows is
# the local gate, the release run stays the full cross-platform proof). Same toolchain floor as
# release.yml's linux-x64 (ubuntu-22.04 = glibc 2.35, PRD §4.14).
on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'plugins/**'
      - 'CMakeLists.txt'
      - 'project.json'
      - 'nx.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ci.yml'
  push:
    branches: [master]
  workflow_dispatch:

# NX self-hosted remote cache (P35 slice 6) — the org token convention from MintPlayer.Spark
# (docs/guide-nx-remote-cache.md): every workflow points at the shared cache, but only post-merge runs
# on the default branch WRITE (NX_CACHE_RW_TOKEN); PR + branch runs are READ-ONLY (NX_CACHE_RO_TOKEN) so
# a PR can never poison the shared cache (the CVE-2025-36852 mitigation, enforced by the token split).
# Fork PRs get no secrets and simply run cold. NOTE: CI is ubuntu; local dev is Windows — their toolchain
# runtime-input hashes differ, so CI entries share only CI↔CI (PR reads master's), not with local Windows.
env:
  NX_SELF_HOSTED_REMOTE_CACHE_SERVER: ${{ secrets.NX_CACHE_SERVER }}
  NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN: ${{ (github.event_name == 'push' && github.ref_name == github.event.repository.default_branch) && secrets.NX_CACHE_RW_TOKEN || secrets.NX_CACHE_RO_TOKEN }}

jobs:
  linux-build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain (cmake, g++)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq cmake g++

      - name: Install NX (gate orchestration only)
        run: npm ci --no-audit --no-fund

      # Build + unit + the two POSIX harness legs (watch-mode polling + the registry HTTP transport — the
      # `#ifdef`-forked code that broke every P30 POSIX release leg) run through NX so they read/write the
      # shared remote cache: an unchanged-source PR gets remote hits from the last master build. The nx
      # `build` target is OS-aware (cmake+POLYGLOT_VERSION=0.0.0-dev on Linux — the shallow-checkout pin);
      # `cache: false`, so it always runs, but the cacheable legs skip when their inputs are unchanged.
      # The runners stay invocable WITHOUT nx (release.yml calls them directly) — nx is orchestration only.
      - name: Gate (nx run-many — build + unit + watch + registry, remote-cached)
        run: npx nx run-many -t unit,watch,registry --output-style=stream

      # P39 coverage attribution. Deliberately its OWN step rather than a fourth nx target in the line
      # above, and bounded: as a new leg its first CI outing hung for the job's whole time budget while
      # printing nothing, because a task's output sits in the pipe buffer until it exits — so a hang
      # inside `run-many` is both unattributable and unbounded. A separate step with `timeout-minutes`
      # fails in six minutes naming this leg. It also exercises the standing contract that every runner
      # is invocable WITHOUT nx (no -Cli: the runner finds build/polyglot itself).
      # `npx nx run polyglot:coverage` still works locally and keeps the cache entry.
      - name: Coverage-attribution leg (isolated, bounded)
        timeout-minutes: 6
        run: pwsh -NoProfile -File tests/coverage/run-coverage.ps1

      - name: Smoke transpile (plugins found next to the binary, not cwd)
        run: |
          printf 'fn main() {\n  print(6 * 7)\n}\n' > /tmp/smoke.pg
          (cd /tmp && "$GITHUB_WORKSPACE/build/polyglot" build /tmp/smoke.pg --target csharp --out /tmp/ --lib io)
          grep -q 'print(6 \* 7)' /tmp/smoke.cs

  # Wave-2 slice 7: C++ line coverage of the Core/CLI, report-only (no threshold until a baseline
  # exists). Unit suite + a four-target CLI transpile sweep of the conformance programs, so both the
  # front-end AND the emitter/rule-interpreter paths accumulate .gcda. What this deliberately does NOT
  # measure: the plugin JSON templates — their instrument is the differential conformance suite.
  coverage:
    runs-on: ubuntu-22.04
    # OIDC instead of a COVERAGE_TOKEN secret: this repo is public, so it authenticates to the
    # coverage server tokenlessly (the MintPlayer.AI precedent). Fork PRs cannot mint an id-token
    # and are skipped by the upload step's guard rather than failing.
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain (cmake, g++, gcovr)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq cmake g++ gcovr

      - name: Build (Debug, --coverage)
        run: |
          cmake -S . -B build-cov -DCMAKE_BUILD_TYPE=Debug -DPOLYGLOT_VERSION=0.0.0-dev \
            -DCMAKE_CXX_FLAGS=--coverage -DCMAKE_EXE_LINKER_FLAGS=--coverage
          cmake --build build-cov -j"$(nproc)"

      - name: Unit tests (instrumented)
        run: ./build-cov/polyglot-tests

      # `|| true` throughout: this leg's job is EXECUTION, not verification — correctness is the
      # Windows differential gate's job, and a failing transpile must not fail the coverage job.
      # --emit-arm-trace appends to one file across every invocation (the numerator AND the
      # denominator come from the compiler's own parse — see arm_trace.hpp).
      - name: Conformance transpile sweep (instrumented CLI, all four targets)
        run: |
          mkdir -p /tmp/cov-out coverage/plugins
          for t in csharp typescript python php; do
            for p in tests/conformance/programs/*.pg; do
              ./build-cov/polyglot --emit-arm-trace /tmp/arm-trace.tsv \
                build "$p" --target "$t" --lib io --out /tmp/cov-out >/dev/null 2>&1 || true
            done
          done

      # Widen past `build`, or the diagnostic and front-end-only paths read as dead code and
      # dishonestly depress the baseline. Both are runtime-free, so this costs seconds.
      # Multi-file programs build the way the conformance runner builds them — entry.pg + --root
      # with a pgconfig naming every target, not a single --target. Swept as loose files they would
      # miss the linked-module arms entirely (`module.linked` -> `partial `, attribute imports,
      # module globals), which measured as a ~20% slice of each manifest on their own.
      - name: Multi-module sweep (config-sourced, all targets at once)
        run: |
          for d in tests/conformance/programs/*/; do
            [ -f "$d/entry.pg" ] || continue
            w="/tmp/cov-mod/$(basename "$d")"
            mkdir -p "$w" && cp -r "$d"/* "$w"/
            echo '{ "targets": ["csharp","typescript","python","php"] }' > "$w/pgconfig.json"
            ./build-cov/polyglot --emit-arm-trace /tmp/arm-trace.tsv \
              build "$w/entry.pg" --root "$w" --lib io --out "$w" >/dev/null 2>&1 || true
          done

      - name: Diagnostic sweep (refusals + check)
        run: |
          for p in tests/refusals/fixtures/*.pg; do
            ./build-cov/polyglot --emit-arm-trace /tmp/arm-trace.tsv \
              build "$p" --target csharp --lib io --out /tmp/cov-out >/dev/null 2>&1 || true
          done
          for p in tests/conformance/programs/*.pg; do
            ./build-cov/polyglot --emit-arm-trace /tmp/arm-trace.tsv \
              check "$p" --lib io >/dev/null 2>&1 || true
          done

      # Same reason as the multi-module sweep above: `coverage remap` is a whole subcommand plus four
      # report readers and writers that `build` never reaches, so without this sweep it reads as dead
      # code and dishonestly depresses the baseline. It is exercised for correctness by
      # tests/coverage/run-coverage.ps1; this step exists only to EXECUTE it under instrumentation.
      # Both origin styles, every input format, and the error paths that refuse.
      - name: Coverage-attribution sweep (both origin sinks, every format)
        run: |
          w=/tmp/cov-attr && mkdir -p "$w"
          for t in python csharp; do
            ./build-cov/polyglot build docs/lang/samples/03_enums_unions_match.pg \
              --target "$t" --out "$w/$t" --origin-info >/dev/null 2>&1 || true
          done
          # sourceMapV3: project the committed real coverage.py reports, every output format.
          for f in cobertura lcov istanbul clover; do
            for r in py.cobertura.xml py.lcov; do
              ./build-cov/polyglot coverage remap "tests/coverage/fixtures/reports/$r" \
                --target python --generated-dir tests/coverage/fixtures/generated --root . \
                --out-format "$f" --out "$w/out-$r-$f" >/dev/null 2>&1 || true
            done
          done
          ./build-cov/polyglot coverage remap tests/coverage/fixtures/reports/py.lcov \
            --target python --generated-dir tests/coverage/fixtures/generated --root . \
            --branch-arms --out "$w/arms.lcov" >/dev/null 2>&1 || true
          # directive: a .pg-keyed report passing through, and one that is not (the refusal path).
          printf '<coverage><packages><package><classes><class name="m" filename="%s"><lines><line number="1" hits="4"/></lines></class></classes></package></packages></coverage>' \
            "docs/lang/samples/03_enums_unions_match.pg" > "$w/cs.xml"
          ./build-cov/polyglot coverage remap "$w/cs.xml" --target csharp \
            --generated-dir "$w/csharp" --root . --out "$w/cs.pg.xml" >/dev/null 2>&1 || true
          # Refusals: unknown format, unparseable report, no origin data, a target with no sink.
          mkdir -p "$w/empty"
          echo 'not a coverage report' > "$w/junk.txt"
          ./build-cov/polyglot coverage remap "$w/junk.txt" --target python \
            --generated-dir tests/coverage/fixtures/generated --root . --out "$w/x" >/dev/null 2>&1 || true
          ./build-cov/polyglot coverage remap tests/coverage/fixtures/reports/py.lcov --target python \
            --format cobertura --generated-dir tests/coverage/fixtures/generated --root . \
            --out "$w/x" >/dev/null 2>&1 || true
          ./build-cov/polyglot coverage remap tests/coverage/fixtures/reports/py.lcov --target python \
            --generated-dir "$w/empty" --root . --out "$w/x" >/dev/null 2>&1 || true
          ./build-cov/polyglot coverage remap tests/coverage/fixtures/reports/py.lcov \
            --target nosuchtarget --root . --out "$w/x" >/dev/null 2>&1 || true
          ./build-cov/polyglot coverage >/dev/null 2>&1 || true
          ./build-cov/polyglot coverage --help >/dev/null 2>&1 || true

      - name: Coverage report (gcovr)
        run: |
          mkdir -p coverage-report coverage/cpp
          # `--xml` (not `--cobertura`): both emit Cobertura, but the spelling `--cobertura` only
          # exists in gcovr >= 5.1 and ubuntu-22.04 ships 5.0. `--xml` works on both.
          gcovr --root . --filter 'src/' --print-summary \
            --xml coverage/cpp/cobertura.xml \
            --html-details coverage-report/index.html --txt coverage-report/summary.txt
          { echo '### C++ coverage — Core + CLI (unit suite + conformance transpile sweep)';
            echo '```';
            cat coverage-report/summary.txt;
            echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      # Plugin arm coverage: fold the trace into one lcov per manifest. This is what SP1 probes —
      # whether the server ingests and renders a report whose source file is a .json.
      - name: Plugin arm coverage (trace -> lcov)
        run: |
          pwsh -NoProfile -File scripts/arm-trace-to-lcov.ps1 \
            -Trace /tmp/arm-trace.tsv -OutDir coverage/plugins

      # The server resolves report paths by longest-suffix match against `git ls-files` and drops a
      # non-matching path SILENTLY — a wrong number, not an error. Fail loudly instead.
      - name: Verify coverage paths resolve
        run: pwsh -NoProfile -File scripts/verify-coverage-paths.ps1 -Path coverage

      # Publishing to coverage.mintplayer.com (org convention: the shared MintPlayer.Spark action).
      # NOTE: `partial:` is deliberately NOT set, unlike the nx repos. Those upload an `nx affected`
      # subset and must declare it partial so the server compares like-for-like; this job uses no NX
      # and no affected set — it builds cold and sweeps the entire conformance corpus on every run,
      # so its upload is COMPLETE. Declaring it partial would invite the server to carry stale file
      # data forward over freshly-measured files.
      - name: Upload coverage
        if: >
          (github.event_name != 'pull_request'
           || github.event.pull_request.head.repo.full_name == github.repository)
          && hashFiles('coverage/cpp/cobertura.xml') != ''
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        uses: MintPlayer/MintPlayer.Spark/apps/CodeCoverage/action@coverage-upload-v1
        with:
          url: https://coverage.mintplayer.com
          use-oidc: true
          files: |
            coverage/cpp/cobertura.xml
            coverage/plugins/*.lcov
          disable-search: true
          flags: cpp-core,plugins,linux
          base-sha: ${{ github.event.pull_request.base.sha }}
          finish: true
          fail-ci-if-error: ${{ github.event_name != 'pull_request' }}

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage-report/
